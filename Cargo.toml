[workspace]
resolver = "3"
members = ["ob_common","ob_core", "ob_lib"]

[workspace.dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "postgres"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ob_common = { path = "ob_common" }
ob_core = { path = "ob_core" }
ob_lib = { path = "ob_lib" }
