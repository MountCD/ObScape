[package]
name = "obsistent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
snailquote = "0.3.1"
