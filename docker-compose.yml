services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: obscape
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d obscape"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  ob_core:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config.toml:/etc/obscape/config.toml:ro"
    environment:
      # Переопределяет database_url из config.toml (CLI > ENV > TOML).
      OBSISTENT_DATABASE: postgres://postgres:pass@db:5432/obscape
    ports:
      - "11080:11080"
    restart: unless-stopped

volumes:
  pgdata:
