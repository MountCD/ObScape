# Секреты и порты берутся из .env (см. .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-obscape}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-obscape}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  ob_core:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config.toml:/home/obscape/config.toml:ro"
    # Пробрасывает OBSISTENT_AGENT_*_API_KEY и прочие OBSISTENT_* из .env.
    env_file:
      - path: .env
        required: false
    environment:
      # Переопределяет database_url из config.toml (CLI > ENV > TOML).
      OBSISTENT_DATABASE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-obscape}
    # На Linux даёт контейнеру имя host.docker.internal для хоста:
    # api_url вида http://host.docker.internal:1234 достучится до
    # локальной модели на хосте (127.0.0.1 из контейнера — это контейнер).
    # Сам апстрим при этом должен слушать не только 127.0.0.1, а 0.0.0.0.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OB_PORT:-11080}:11080"
    restart: unless-stopped

volumes:
  pgdata:
