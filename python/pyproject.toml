[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obscape"
version = "0.0.6"
description = "ObScape client: HTTP chat API and Unix-socket config control"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["obscape", "llm", "ollama", "chat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/mountcd/obscape"

[tool.setuptools.packages.find]
include = ["obscape*"]
